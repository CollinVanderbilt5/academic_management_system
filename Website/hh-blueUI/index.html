<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Limelight&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="title">
      <h1>Whiteboard</h1>
    </div>
    <div class="login-box">
      <h2>Login</h2>

      <form action="homepage.html" method="POST">
        <input
          type="text"
          placeholder="Enter ID"
          class="login-input"
          required
        />
        <input
          type="password"
          placeholder="Enter Password"
          class="login-input"
          required
        />
        <button type="submit" class="login-button">Login</button>
      </form>
    </div>
  </body>
</html>
