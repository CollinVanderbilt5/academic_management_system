<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="forms.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Limelight&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      .section-title {
        margin-top: 20px;
        font-weight: bold;
        font-size: 18px;
      }

      .assignment-box {
        border: 1px solid rgb(56, 123, 150);
        background: rgb(244, 248, 250);
        padding: 10px;
        margin-top: 10px;
        border-radius: 4px;
      }

      .due-warning {
        color: red;
        font-size: 14px;
        margin-left: 10px;
      }

      .highlight {
        background: rgb(170, 198, 214);
        padding: 2px 4px;
        border-radius: 2px;
      }

      .calendar-grid {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      .calendar-grid div {
        flex: 1;
      }

      .course-button {
        display: block;
        margin: 0 auto;
        padding: 6px 14px;
        background: rgb(87, 174, 209);
        border: 1px solid skyblue;
        border-radius: 4px;
        margin-bottom: 20px;
        color: white;
        font-family: "Tasa Explorer", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="title">
      <div id="name">John Doe</div>
      <h1>Whiteboard</h1>
      <div id="username">Student</div>
    </div>
    <div id="back-button">
      <a href="homepage.html" class="back-button"><p>Back to Homepage</p></a>
    </div>
    <div class="form-box">
      <div class="form-header">Calendar View</div>

      <div class="form-content">
        <div class="calendar-grid">
          <div>
            <label>Highlight</label><br />
            <input type="checkbox" /> Due Today<br />
            <input type="checkbox" /> Due This Week
          </div>

          <div>
            <label>Search</label><br />
            Assignment Name: <br />
            <input type="text" /><br />
            CourseID: <br />
            <input type="text" />
          </div>

          <div>
            <label>Organize by:</label><br />
            <input type="checkbox" /> Due Date<br />
            <input type="checkbox" /> Class
          </div>
        </div>

        <button class="course-button">COMP SCI 2300</button>

        <!-- Example assignments (static placeholders) -->
        <div class="assignment-box">
          <div><strong>Homework 3</strong></div>
          <div>
            Due: Thursday, March 12th
            <span class="due-warning">Past due date. Mark complete?</span>
          </div>
        </div>

        <div class="assignment-box">
          <div><strong>Project Report</strong></div>
          <div>Due: <span class="highlight">Friday, March 13th</span></div>
        </div>

        <div class="assignment-box">
          <div><strong>Quiz #14</strong></div>
          <div>Due: Sunday, March 15th</div>
        </div>
      </div>
    </div>
  </body>
</html>
