<!DOCTYPE html>
<html>
  <head>
    <title>Whiteboard Add and Remove User</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='forms.css')}}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css')}}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Limelight&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <script defer src="{{ url_for('static', filename='adduser.js') }}"></script>
  </head>

  <body>
    <div id="title">
      <h1>Whiteboard</h1>
    </div>
    <div class="form-box">
      <div class="form-header">Add/Remove User</div>

      <div class="form-content">
        <div class="form-row">
          <button id="add" class="login-button"> Add</button>
          <button id="remove" class="login-button"> Delete</button>
        </div>

        <div class="form-row">
          <div><input id="stu" type="checkbox" /> Student</div>
          <div><input id="prof" type="checkbox" /> Professor</div>
          <div><input id="adv" type="checkbox" /> Advisor</div>
        </div>

        <div class="note">
          *As a student, you cannot choose another user type
        </div>

        <label>Enter ID</label>
        <input id="ID" type="text" />

        <label>Enter Password</label>
        <input id="password" type="password" />

        <label>Confirm Password <a id="warning" style="color: red"></a></label>
        <input id="password_confirm" type="password" />
      </div>
    </div>
  </body>
</html>
