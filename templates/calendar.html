<!DOCTYPE html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='forms.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Limelight&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <style>
      .section-title {
        margin-top: 20px;
        font-weight: bold;
        font-size: 18px;
      }

      .assignment-box {
        border: 1px solid rgb(56, 123, 150);
        background: rgb(244, 248, 250);
        padding: 10px;
        margin-top: 10px;
        border-radius: 4px;
      }

      .due-warning {
        color: red;
        font-size: 14px;
        margin-left: 10px;
      }

      .highlight {
        background: rgb(170, 198, 214);
        padding: 2px 4px;
        border-radius: 2px;
      }

      .calendar-grid {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      .calendar-grid div {
        flex: 1;
      }

      .course-button {
        display: block;
        margin: 0 auto;
        padding: 6px 14px;
        background: rgb(87, 174, 209);
        border: 1px solid skyblue;
        border-radius: 4px;
        margin-bottom: 20px;
        color: white;
        font-family: "Tasa Explorer", sans-serif;
      }
    </style>

    <script src="{{ url_for('static', filename='main.js') }}" defer></script>
    <script
      src="{{ url_for('static', filename='calendar.js') }}"
      defer
    ></script>
  </head>

  <body>
    <div id="title">
      <div id="name">Loading...</div>
      <h1 id="whiteboard">Whiteboard</h1>
      <div id="username">Student</div>
    </div>

    <div id="back-button">
      <a href="{{ url_for('homepage') }}" class="back-button">
        <p>Back to Homepage</p>
      </a>
    </div>

    <div class="form-box">
      <div class="form-header">Calendar View</div>

      <div class="form-content">
        <div class="calendar-grid">
          <div>
            <label>Highlight</label><br />
            <input type="checkbox" id="filter-today" /> Due Today<br />
            <input type="checkbox" id="filter-week" /> Due This Week
          </div>

          <div>
            <label>Search</label><br />
            Assignment Name: <br />
            <input type="text" id="search-name" /><br />
            CourseID: <br />
            <input type="text" id="search-course" />
          </div>

          <div>
            <label>Organize by:</label><br />
            <input type="checkbox" id="sort-date" /> Due Date<br />
            <input type="checkbox" id="sort-class" /> Class
          </div>
        </div>

        <button class="course-button" id="load-classes">View My Classes</button>

        <!-- Dynamic assignments load here -->
        <div id="assignments-container"></div>
      </div>
    </div>
  </body>
</html>
