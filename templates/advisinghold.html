<!DOCTYPE html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='forms.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Limelight&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      .status-text {
        margin-top: 10px;
        font-size: 16px;
      }
      .true-status {
        color: green;
        font-weight: bold;
      }
      .button-row {
        margin-top: 15px;
      }
      .swap-btn,
      .exit-btn {
        padding: 6px 16px;
        border: 1px solid #555;
        background: #d9dfd9;
        border-radius: 4px;
        margin-right: 10px;
      }
    </style>
    <script src="{{ url_for('static', filename='main.js') }}" defer></script>
    <script
      src="{{ url_for('static', filename='advisinghold.js') }}"
      defer
    ></script>
  </head>
  <body>
    <div id="title">
      <div id="name">John Doe</div>
      <h1 id="whiteboard">Whiteboard</h1>
      <div id="username">Student</div>
    </div>
    <div id="back-button">
      <a href="{{ url_for('homepage') }}" class="back-button"
        ><p>Back to Homepage</p></a
      >
    </div>
    <div class="form-box">
      <div class="form-header">Edit Student Advising Hold</div>

      <div class="form-content">
        <label>Enter Student ID</label>
        <input type="text" id="advise-student-id" />

        <div class="status-text">
          This student's advising hold is set as:
          <span id="advise-status" class="true-status">Status</span>
        </div>

        <div class="button-row">
          <button id="swap-btn" class="swap-btn">Swap</button>
        </div>
      </div>
    </div>
  </body>
</html>
